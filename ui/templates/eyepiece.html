<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser DMX - Tailscale Eyepiece</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #FF6B6B;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #FF6B6B;
        }
        
        header p {
            color: #a0a0a0;
            font-size: 0.9em;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 107, 107, 0.05);
            border: 1px solid #FF6B6B;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .card h2 {
            color: #FF6B6B;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 1px solid #FF6B6B;
            padding-bottom: 10px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-weight: 500;
            color: #b0b0b0;
        }
        
        .status-value {
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            text-align: right;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .badge-running {
            background-color: rgba(76, 175, 80, 0.3);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }
        
        .badge-stopped {
            background-color: rgba(244, 67, 54, 0.3);
            color: #F44336;
            border: 1px solid #F44336;
        }
        
        .badge-connected {
            background-color: rgba(33, 150, 243, 0.3);
            color: #2196F3;
            border: 1px solid #2196F3;
        }
        
        .connection-info {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #FF6B6B;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        
        .connection-info h3 {
            color: #FF6B6B;
            margin-bottom: 10px;
        }
        
        .connection-info code {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            color: #4CAF50;
            display: block;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #a0a0a0;
            font-size: 0.85em;
            border-top: 1px solid rgba(255, 107, 107, 0.2);
            margin-top: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        
        .spinner {
            border: 3px solid rgba(255, 107, 107, 0.2);
            border-top: 3px solid #FF6B6B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #F44336;
            color: #F44336;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        
        .refresh-info {
            text-align: center;
            color: #a0a0a0;
            font-size: 0.85em;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Laser DMX Eyepiece</h1>
            <p>Remote Monitoring via Tailscale VPN</p>
        </header>
        
        <div class="connection-info">
            <h3>📡 Tailscale Connection</h3>
            <p>Connected via secure VPN tunnel</p>
            <code id="tailscale-ip">IP: Loading...</code>
            <div class="refresh-info" id="last-update"></div>
        </div>
        
        <div id="status-content" class="loading">
            <div class="spinner"></div>
            <p>Loading system status...</p>
        </div>
        
        <footer class="footer">
            <p>Laser DMX Eyepiece • Secure Remote Monitoring • Powered by Tailscale</p>
        </footer>
    </div>
    
    <script>
        // Auto-refresh every 5 seconds
        const REFRESH_INTERVAL = 5000;
        
        async function updateStatus() {
            try {
                const response = await fetch('/api/eyepiece/status');
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                renderStatus(data);
                updateRefreshTime();
            } catch (error) {
                showError('Failed to fetch status: ' + error.message);
            }
        }
        
        function renderStatus(data) {
            const content = document.getElementById('status-content');
            const timestamp = new Date(data.timestamp * 1000).toLocaleTimeString();
            
            content.innerHTML = `
                <div class="grid">
                    <!-- Tailscale Card -->
                    <div class="card">
                        <h2>🌐 Tailscale</h2>
                        <div class="status-item">
                            <span class="status-label">IP Address</span>
                            <span class="status-value">${data.tailscale.ip}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Status</span>
                            <span class="status-value">
                                <span class="status-badge badge-connected">${data.tailscale.status.toUpperCase()}</span>
                            </span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Endpoint</span>
                            <span class="status-value"><a href="http://${data.tailscale.ip}" target="_blank" style="color: #FF6B6B;">Web UI</a></span>
                        </div>
                    </div>
                    
                    <!-- System Card -->
                    <div class="card">
                        <h2>🖥️ System</h2>
                        <div class="status-item">
                            <span class="status-label">Uptime</span>
                            <span class="status-value">${data.system.uptime}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">CPU Cores</span>
                            <span class="status-value">${data.system.cpu_cores}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Memory</span>
                            <span class="status-value">${data.system.memory.used} / ${data.system.memory.total}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Local IP</span>
                            <span class="status-value">${data.system.network_ip}</span>
                        </div>
                    </div>
                    
                    <!-- Services Card -->
                    <div class="card">
                        <h2>⚙️ Services</h2>
                        <div class="status-item">
                            <span class="status-label">DMX UI</span>
                            <span class="status-value">
                                <span class="status-badge badge-running">${data.services.dmx_ui.status.toUpperCase()}</span>
                            </span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">QLC+</span>
                            <span class="status-value">
                                <span class="status-badge ${data.services.qlcplus.status === 'running' ? 'badge-running' : 'badge-stopped'}">
                                    ${data.services.qlcplus.status.toUpperCase()}
                                </span>
                            </span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Last Status</span>
                            <span class="status-value">${data.last_status_message}</span>
                        </div>
                    </div>
                </div>
                
                <div class="footer">
                    <p>Last updated: ${timestamp}</p>
                </div>
            `;
            
            // Update Tailscale IP in header
            document.getElementById('tailscale-ip').textContent = `IP: ${data.tailscale.ip}`;
        }
        
        function showError(message) {
            const content = document.getElementById('status-content');
            content.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }
        
        function updateRefreshTime() {
            const now = new Date().toLocaleTimeString();
            document.getElementById('last-update').innerHTML = `
                <p>Auto-refreshing every ${REFRESH_INTERVAL/1000}s • Last refresh: ${now}</p>
            `;
        }
        
        // Initial load
        updateStatus();
        
        // Set up auto-refresh
        setInterval(updateStatus, REFRESH_INTERVAL);
    </script>
</body>
</html>
